data:
    sample_rate: 16000
    crop_seconds: 0.5
    batch_size: 12

logging:
    comet: true
    project: "DL_SoundStream"
    experiment: "train"
    audio_every: 5000
    audio_count: 2


train:
    device: "cuda"
    lr: 0.0001
    batch_limit: false
    batch_count: 100
    max_steps: 45000
    log_every: 10

generator_loss_weights:
    reconstruction: 1
    adversarial: 1
    feature_matching: 100
    commitment: 1

reconstruction_loss:
    scales: [64, 128, 256, 512, 1024, 2048]
    n_mels: 64

model:
    channels: 32
    emb_dim: 128
    strides: [2, 4, 5, 5]
    quants_num: 8
    codebook_size: 1024
    ema_gamma: 0.99
    dead_code_warmup: 100
    dead_code_replace_every: 10
    dead_code_threshold: 2.0

checkpoint:
    dir: "checkpoints_train"
    save_every: 500
    keep_every: 5000
    resume_from: null

eval:
    checkpoint_path: "checkpoints_train/latest.pt"
    name: "test-clean"
    device: "cuda"

validation:
    enabled: true
    every: 2500
    name: "test-clean"
