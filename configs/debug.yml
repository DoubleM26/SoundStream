data:
    sample_rate: 16000
    crop_seconds: 0.5
    batch_size: 12

logging:
    comet: false
    project: "DL_SoundStream"
    experiment: "Simple model"

train:
    device: "mps"
    lr: 0.0001
    batch_limit: true
    batch_count: 1

generator_loss_weights:
    reconstruction: 1
    adversarial: 1
    feature_matching: 100
    commitment: 0

reconstruction_loss:
    scales: [64, 128, 256, 512, 1024, 2048]
    n_mels: 64