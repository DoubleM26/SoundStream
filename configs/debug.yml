data:
    sample_rate: 16000
    crop_seconds: 0.5
    batch_size: 12

logging:
    comet: True
    project: "DL_SoundStream"
    experiment: "Simple model"
    audio_every: 100
    audio_count: 2


train:
    device: "mps"
    lr: 0.0001
    batch_limit: true
    batch_count: 1000

generator_loss_weights:
    reconstruction: 1
    adversarial: 1
    feature_matching: 100
    commitment: 1

reconstruction_loss:
    scales: [64, 128, 256, 512, 1024, 2048]
    n_mels: 64

model:
    channels: 32
    emb_dim: 128
    strides: [2, 4, 5, 5]
    quants_num: 8
    codebook_size: 1024
    ema_gamma: 0.99
    dead_code_warmup: 100
    dead_code_replace_every: 10
    dead_code_threshold: 2.0
